<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>西总布胡同 · 城市更新漫游</title>
    <style>
        /* 基础重置与全屏布局 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #1a1a1a; }

        /* 1. 视频播放层 */
        #video-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh; z-index: 10;
            background: #fff; overflow: hidden;
            transition: opacity 0.3s ease-in-out; /* 1秒缓慢淡出 */
        }
        #video-container video {
            width: 100%; height: 100%; object-fit: cover; display: block;
        }
        /* 视频结束后的隐藏状态 */
        #video-container.fade-out {
            opacity: 0; pointer-events: none;
        }

        /* 2. 长图地图内容层 */
        #interactive-content {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1;
            display: none; opacity: 0; transition: opacity 1.5s ease;
            background: #f5f5f0; /* 底色调 */
            overflow-x: auto; overflow-y: hidden; /* 纵向隐藏，横向滚动 */
            cursor: grab; /* 鼠标抓取感 */
        }
        #interactive-content:active { cursor: grabbing; }
        
        /* 横向长图样式：高度撑满屏幕，宽度自适应（会超出视口） */
        #interactive-content img {
            height: 100vh; width: auto; max-width: none; display: block;
        }

        /* 3. 移动端横屏提示层 */
        #rotate-notice {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh; z-index: 100;
            display: flex; justify-content: center; align-items: center;
            background: rgba(0, 0, 0, 0.85); color: white; text-align: center; padding: 40px;
            flex-direction: column;
            /* 默认隐藏，仅在竖屏时显示 */
            display: none; 
        }
        #rotate-notice h2 { font-size: 24px; margin-bottom: 20px; font-weight: 400; }
        #rotate-notice p { font-size: 14px; opacity: 0.7; }
        /* 图标 */
        .rotate-icon {
            font-size: 60px; margin-bottom: 20px; display: inline-block;
            animation: spin-phone 2s infinite ease-in-out;
        }
        @keyframes spin-phone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
            100% { transform: rotate(90deg); }
        }

        /* 竖屏媒体查询：激活提示层 */
        @media screen and (orientation: portrait) {
            #rotate-notice { display: flex; }
            #interactive-content { display: none !important; }
        }
        /* 横屏时确保提示层隐藏，地图显示 */
        @media screen and (orientation: landscape) {
            #rotate-notice { display: none !important; }
            #interactive-content { display: block !important; }
        }
    </style>
</head>
<body>

    <!-- 第一层：场景动画视频 -->
    <div id="video-container">
        <video id="intro-video" playsinline webkit-playsinline muted>
            <source src="images/project_hutong/intro.webm" type="video/webm">
            <source src="images/project_hutong/intro.mp4" type="video/mp4">
            您的浏览器不支持 HTML5 视频。
        </video>
    </div>

    <!-- 第二层：横向长图漫游 -->
    <div id="interactive-content">
        <img src="images/project_hutong/hutong_map.png" alt="西总布胡同横向平面漫游图">
        <!-- 提示：长图漫游交互 -->
    </div>

    <!-- 第三层：手机横屏提示 -->
    <div id="rotate-notice">
        <div class="rotate-icon">📱</div>
        <h2>请将手机横屏观看</h2>
        <p>西总布胡同漫游之旅，<br>横屏体验更佳。</p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const video = document.getElementById('intro-video');
            const videoContainer = document.getElementById('video-container');
            const interactiveContent = document.getElementById('interactive-content');
            const mapImage = document.querySelector('#interactive-content img');

            // 1. 视频自动播放
            // 注意：因为加了 muted，浏览器允许自动播放
            video.play().catch(e => console.log("自动播放被阻止，需用户交互", e));

            // 2. 视频结束，接力到地图
            video.addEventListener('ended', function() {
                // 让视频层淡出
                videoContainer.classList.add('fade-out');

                // 等1秒淡出动画结束，彻底隐藏视频，显示地图层
                setTimeout(() => {
                    videoContainer.style.display = 'none';
                    interactiveContent.style.display = 'block';
                    
                    // 稍微延迟一点后，让地图层也淡入（透明度从0到1）
                    setTimeout(() => {
                        interactiveContent.style.opacity = '1';
                    }, 50);
                }, 1000); // 这里的 1000 对应 CSS 里的 1s
            });

            // 3. 鼠标滚轮变为横向移动（体验优化）
            interactiveContent.addEventListener('wheel', function(e) {
                if (e.deltaX === 0) { // 如果是上下滚动
                    e.preventDefault(); // 阻止默认的纵向滚动
                    this.scrollLeft += e.deltaY; // 将纵向滚动的值转化为横向滚动
                }
            }, { passive: false });

            // 4. （可选）由于 CSS 媒体查询已处理“横竖屏”切换，
            // 但为了防极少数竖屏用户在旋转手机时没有自动更新显示，
            // 加一个监听横竖屏变化的刷新
            if (window.screen && window.screen.orientation) {
                window.screen.orientation.addEventListener('change', function() {
                    // 强制重新布局/刷新
                    window.location.reload(); 
                });
            }
        });
    </script>
</body>
</html>
